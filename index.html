<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Ops Tracker</title>
  
  <!-- Inter Font from Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       CSS VARIABLES & THEME SETUP
       Supports auto-detection via prefers-color-scheme and manual override
       Deep Teal Accent: #0f766e (light) / #14b8a6 (dark)
       Brand Palette: Primary #1e74ff (bright blue), Secondary #003672 (navy)
       ========================================================================== */
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      
      /* Light theme tokens */
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-alt-row: #f8fafc;
      --bg-hover: #f1f5f9;
      --border-color: #e2e8f0;
      --border-strong: #cbd5e1;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      
      --accent: #0f766e;
      --accent-hover: #115e59;
      --accent-subtle: #f0fdfa;
      --accent-border: #99f6e4;
      --accent-contrast: #ffffff;

      --brand-primary: #1e74ff;
      --brand-secondary: #003672;

      --trend-positive: #16a34a;
      --trend-positive-bg: #dcfce7;
      --trend-negative: #dc2626;
      --trend-negative-bg: #fee2e2;
      --trend-neutral: #64748b;
      --trend-neutral-bg: #f1f5f9;

      --warning-amber: #b45309;
      --warning-bg: #fef3c7;
      --warning-border: #fcd34d;

      --info-blue: #0369a1;
      --info-bg: #e0f2fe;
      --info-border: #bae6fd;

      --chip-grey-bg: #f1f5f9;
      --chip-grey-text: #475569;
      --chip-amber-bg: #fef3c7;
      --chip-amber-text: #92400e;
      --chip-green-bg: #dcfce7;
      --chip-green-text: #166534;
      --chip-red-bg: #fee2e2;
      --chip-red-text: #991b1b;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 9999px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-page: #0b0f17;
        --bg-card: #131b2a;
        --bg-subtle: #1e293b;
        --bg-alt-row: #101726;
        --bg-hover: #1e293b;
        --border-color: #243044;
        --border-strong: #334155;
        
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-subtle: #64748b;
        
        --accent: #14b8a6;
        --accent-hover: #2dd4bf;
        --accent-subtle: rgba(20, 184, 166, 0.12);
        --accent-border: rgba(20, 184, 166, 0.3);
        --accent-contrast: #042f2e;

        --brand-primary: #1e74ff;
        --brand-secondary: #003672;

        --trend-positive: #4ade80;
        --trend-positive-bg: rgba(74, 222, 128, 0.15);
        --trend-negative: #f87171;
        --trend-negative-bg: rgba(248, 113, 113, 0.15);
        --trend-neutral: #94a3b8;
        --trend-neutral-bg: #1e293b;

        --warning-amber: #fbbf24;
        --warning-bg: rgba(251, 191, 36, 0.15);
        --warning-border: rgba(251, 191, 36, 0.35);

        --info-blue: #38bdf8;
        --info-bg: rgba(56, 189, 248, 0.12);
        --info-border: rgba(56, 189, 248, 0.3);

        --chip-grey-bg: #1e293b;
        --chip-grey-text: #cbd5e1;
        --chip-amber-bg: rgba(245, 158, 11, 0.2);
        --chip-amber-text: #fcd34d;
        --chip-green-bg: rgba(34, 197, 94, 0.2);
        --chip-green-text: #86efac;
        --chip-red-bg: rgba(239, 68, 68, 0.2);
        --chip-red-text: #fca5a5;

        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
      }
    }

    /* Manual theme overrides */
    [data-theme="dark"] {
      --bg-page: #0b0f17;
      --bg-card: #131b2a;
      --bg-subtle: #1e293b;
      --bg-alt-row: #101726;
      --bg-hover: #1e293b;
      --border-color: #243044;
      --border-strong: #334155;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      
      --accent: #14b8a6;
      --accent-hover: #2dd4bf;
      --accent-subtle: rgba(20, 184, 166, 0.12);
      --accent-border: rgba(20, 184, 166, 0.3);
      --accent-contrast: #042f2e;

      --brand-primary: #1e74ff;
      --brand-secondary: #003672;

      --trend-positive: #4ade80;
      --trend-positive-bg: rgba(74, 222, 128, 0.15);
      --trend-negative: #f87171;
      --trend-negative-bg: rgba(248, 113, 113, 0.15);
      --trend-neutral: #94a3b8;
      --trend-neutral-bg: #1e293b;

      --warning-amber: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.15);
      --warning-border: rgba(251, 191, 36, 0.35);

      --info-blue: #38bdf8;
      --info-bg: rgba(56, 189, 248, 0.12);
      --info-border: rgba(56, 189, 248, 0.3);

      --chip-grey-bg: #1e293b;
      --chip-grey-text: #cbd5e1;
      --chip-amber-bg: rgba(245, 158, 11, 0.2);
      --chip-amber-text: #fcd34d;
      --chip-green-bg: rgba(34, 197, 94, 0.2);
      --chip-green-text: #86efac;
      --chip-red-bg: rgba(239, 68, 68, 0.2);
      --chip-red-text: #fca5a5;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
    }

    [data-theme="light"] {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-alt-row: #f8fafc;
      --bg-hover: #f1f5f9;
      --border-color: #e2e8f0;
      --border-strong: #cbd5e1;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      
      --accent: #0f766e;
      --accent-hover: #115e59;
      --accent-subtle: #f0fdfa;
      --accent-border: #99f6e4;
      --accent-contrast: #ffffff;

      --brand-primary: #1e74ff;
      --brand-secondary: #003672;

      --trend-positive: #16a34a;
      --trend-positive-bg: #dcfce7;
      --trend-negative: #dc2626;
      --trend-negative-bg: #fee2e2;
      --trend-neutral: #64748b;
      --trend-neutral-bg: #f1f5f9;

      --warning-amber: #b45309;
      --warning-bg: #fef3c7;
      --warning-border: #fcd34d;

      --info-blue: #0369a1;
      --info-bg: #e0f2fe;
      --info-border: #bae6fd;

      --chip-grey-bg: #f1f5f9;
      --chip-grey-text: #475569;
      --chip-amber-bg: #fef3c7;
      --chip-amber-text: #92400e;
      --chip-green-bg: #dcfce7;
      --chip-green-text: #166534;
      --chip-red-bg: #fee2e2;
      --chip-red-text: #991b1b;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    /* ==========================================================================
       RESET & BASE TYPOGRAPHY
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text-main);
      background-color: var(--bg-page);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-bottom: 60px;
    }

    /* Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Buttons & Interactive */
    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      user-select: none;
    }

    button:hover:not(:disabled) {
      background-color: var(--bg-hover);
      border-color: var(--border-strong);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.btn-primary {
      background-color: var(--accent);
      color: var(--accent-contrast);
      border-color: var(--accent);
    }

    button.btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* Outline Teal Button / Link */
    .btn-outline-teal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 5px 11px;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .btn-outline-teal:hover {
      background-color: var(--accent-subtle);
      border-color: var(--accent-hover);
      color: var(--accent-hover);
    }

    /* Platform & Channel Badges */
    .platform-badge, .channel-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    /* ==========================================================================
       HEADER & NAVIGATION BAR
       ========================================================================== */
    .header-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .header-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
    }

    .header-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 18px;
      background-color: var(--accent);
      border-radius: 2px;
    }

    .week-navigator {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      padding: 4px 6px;
      border-radius: var(--radius-md);
    }

    .week-nav-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      border-radius: var(--radius-sm);
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
    }

    .week-label {
      font-weight: 600;
      font-size: 13.5px;
      padding: 0 10px;
      min-width: 175px;
      text-align: center;
      white-space: nowrap;
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .last-loaded-text {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .theme-toggle-btn {
      padding: 6px 10px;
      font-size: 12px;
    }

    /* ==========================================================================
       NOTIFICATIONS & BANNERS
       ========================================================================== */
    .banner-container {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .banner {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      line-height: 1.45;
    }

    .banner-error {
      background-color: var(--warning-bg);
      color: var(--warning-amber);
      border: 1px solid var(--warning-border);
    }

    .banner-info {
      background-color: var(--info-bg);
      color: var(--info-blue);
      border: 1px solid var(--info-border);
    }

    .banner-neutral {
      background-color: var(--bg-subtle);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .banner-icon {
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .banner-content {
      flex: 1;
    }

    .banner-content strong {
      font-weight: 600;
    }

    .empty-state-box {
      background-color: var(--bg-subtle);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      padding: 24px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13.5px;
      margin: 12px 0;
    }

    .carry-forward-notice {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--info-blue);
      background-color: var(--info-bg);
      border: 1px solid var(--info-border);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
    }

    /* ==========================================================================
       HIGHLIGHTS CALLOUT
       ========================================================================== */
    .highlights-section {
      background-color: var(--bg-card);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-md);
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .highlights-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .highlights-body {
      font-size: 14px;
      color: var(--text-main);
      white-space: pre-wrap;
      line-height: 1.6;
    }

    /* ==========================================================================
       TOP 6 SUMMARY TILES
       ========================================================================== */
    .top-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .summary-tile {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.15s ease;
    }

    .summary-tile:hover {
      border-color: var(--border-strong);
    }

    .summary-tile-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .summary-tile-value {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .summary-tile-trend {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }

    .trend-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 600;
    }

    .trend-positive {
      color: var(--trend-positive);
      background-color: var(--trend-positive-bg);
    }

    .trend-negative {
      color: var(--trend-negative);
      background-color: var(--trend-negative-bg);
    }

    .trend-amber {
      color: var(--warning-amber);
      background-color: var(--warning-bg);
    }

    .trend-neutral {
      color: var(--trend-neutral);
      background-color: var(--trend-neutral-bg);
    }

    /* ==========================================================================
       SECTION CARDS & INTERIOR TILES
       ========================================================================== */
    .ops-section {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .mini-stat-card {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
    }

    .mini-stat-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }

    .mini-stat-val {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .mini-stat-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.35;
    }

    /* Stage Badges List in Leads */
    .stage-chips-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .stage-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .stage-pill-discussion {
      background-color: var(--chip-grey-bg);
      color: var(--chip-grey-text);
      border-color: var(--border-color);
    }

    .stage-pill-proposal {
      background-color: var(--chip-amber-bg);
      color: var(--chip-amber-text);
    }

    .stage-pill-contract-signed {
      background-color: var(--chip-green-bg);
      color: var(--chip-green-text);
    }

    .stage-pill-dropped {
      background-color: var(--chip-red-bg);
      color: var(--chip-red-text);
    }

    /* ITI College Type Tag */
    .college-type-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: var(--radius-sm);
    }

    .college-type-tag.government {
      background-color: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .college-type-tag.private {
      background-color: var(--chip-grey-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .state-group-divider td {
      border-top: 2px solid var(--border-strong) !important;
    }

    /* ==========================================================================
       DATA TABLES
       Dense, tabular figures, alternating rows, sticky column support
       ========================================================================== */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--bg-card);
    }

    table.ops-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
    }

    table.ops-table th {
      background-color: var(--bg-subtle);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    table.ops-table th:last-child {
      border-right: none;
    }

    table.ops-table td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      color: var(--text-main);
    }

    table.ops-table td:last-child {
      border-right: none;
    }

    table.ops-table tbody tr:nth-child(even) {
      background-color: var(--bg-alt-row);
    }

    }

    .text-center {
      text-align: center !important;
    }

    .text-left {
      text-align: left !important;
    }

      justify-content: center;

    }

      text-decoration: line-through;
    }

       ========================================================================== */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: var(--text-main);
      color: var(--bg-card);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      z-index: 1000;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================================
       SPINNER / LOADING STATE
       ========================================================================== */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .header-inner {

      .week-label {

        flex: 1;
      }
      .ops-section {
        padding: 16px 14px;
      }

    /* ==========================================================================
       2. CSV PARSER
       Industrial-strength parser handling:
       - Double-quoted cells with commas & embedded newlines
       - Escaped quotes ("")
       - Windows (\r\n) and Unix (\n) line endings
       - Header normalization (lowercase, trimmed)
       ========================================================================== */
    function parseCSV(text) {
      if (!text || typeof text !== 'string') return [];
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;
      let i = 0;
      const len = text.length;

      while (i < len) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (insideQuotes) {
          if (char === '"') {
            if (nextChar === '"') {
              currentCell += '"';
              i += 2;
              continue;
            } else {
              insideQuotes = false;
              i++;
              continue;
            }
          } else {
            currentCell += char;
            i++;
            continue;
          }
        } else {
          if (char === '"') {
            insideQuotes = true;
            i++;
            continue;
          } else if (char === ',') {
            currentRow.push(currentCell.trim());
            currentCell = '';
            i++;
            continue;
          } else if (char === '\r') {
            if (nextChar === '\n') {
              i++;
            }
            currentRow.push(currentCell.trim());
            currentCell = '';
            if (currentRow.length > 0 && currentRow.some(c => c !== '')) {
              rows.push(currentRow);
            }
            currentRow = [];
            i++;
            continue;
          } else if (char === '\n') {
            currentRow.push(currentCell.trim());
            currentCell = '';
            if (currentRow.length > 0 && currentRow.some(c => c !== '')) {
              rows.push(currentRow);
            }
            currentRow = [];
            i++;
            continue;
          } else {
            currentCell += char;
            i++;
            continue;
          }
        }
      }

      if (currentCell.length > 0 || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        if (currentRow.some(c => c !== '')) {
          rows.push(currentRow);
        }
      }

      if (rows.length === 0) return [];

      // Normalize headers: lowercase and trimmed
      const rawHeaders = rows[0];
      const headers = rawHeaders.map(h => (h || '').toLowerCase().trim());

      const result = [];
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        if (row.length === 0 || row.every(val => val === '')) continue;
        const obj = {};
        for (let c = 0; c < headers.length; c++) {
          const header = headers[c];
          if (header) {
            obj[header] = c < row.length ? row[c] : '';
          }
        }
        result.push(obj);
      }
      return result;
    }

    /* ==========================================================================
       3. DATE & WEEK LOGIC
       - Parse YYYY-MM-DD or DD/MM/YYYY
       - Standardize to Monday of that week in UTC to avoid local timezone drift
       ========================================================================== */
    function parseDateToMonday(str) {
      if (!str) return null;
      str = String(str).trim();
      let y, m, d;

      if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(str)) {
        const parts = str.split(/[-/T ]/);
        y = parseInt(parts[0], 10);
        m = parseInt(parts[1], 10);
        d = parseInt(parts[2], 10);
      } else if (/^\d{1,2}[-/]\d{1,2}[-/]\d{2,4}/.test(str)) {
        const parts = str.split(/[-/]/);
        d = parseInt(parts[0], 10);
        m = parseInt(parts[1], 10);
        y = parseInt(parts[2], 10);
        if (y < 100) y += 2000;
      } else {
        const parsed = new Date(str);
        if (isNaN(parsed.getTime())) return null;
        const istTime = new Date(parsed.getTime() + (330 + parsed.getTimezoneOffset()) * 60000);
        y = istTime.getFullYear();
        m = istTime.getMonth() + 1;
        d = istTime.getDate();
      }

      if (!y || !m || !d || isNaN(y) || isNaN(m) || isNaN(d)) return null;

      const dt = new Date(Date.UTC(y, m - 1, d));
      const day = dt.getUTCDay();
      const diffToMonday = (day + 6) % 7;
      dt.setUTCDate(dt.getUTCDate() - diffToMonday);

      const monY = dt.getUTCFullYear();
      const monM = String(dt.getUTCMonth() + 1).padStart(2, '0');
      const monD = String(dt.getUTCDate()).padStart(2, '0');
      return `${monY}-${monM}-${monD}`;
    }

    const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function formatWeekLabel(mondayStr) {
      if (!mondayStr) return '–';
      const parts = mondayStr.split('-');
      if (parts.length < 3) return mondayStr;

      const y = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      const d = parseInt(parts[2], 10);

      const mon = new Date(Date.UTC(y, m - 1, d));
      const sun = new Date(Date.UTC(y, m - 1, d + 6));

      const monD = mon.getUTCDate();
      const monM = MONTH_NAMES[mon.getUTCMonth()];
      const sunD = sun.getUTCDate();
      const sunM = MONTH_NAMES[sun.getUTCMonth()];
      const sunY = sun.getUTCFullYear();

      if (mon.getUTCMonth() === sun.getUTCMonth() && mon.getUTCFullYear() === sun.getUTCFullYear()) {
        return `${monD} – ${sunD} ${sunM} ${sunY}`;
      } else {
        return `${monD} ${monM} – ${sunD} ${sunM} ${sunY}`;
      }
    }

    function formatCarryForwardDate(mondayStr) {
      if (!mondayStr) return '';
      const parts = mondayStr.split('-');
      if (parts.length < 3) return mondayStr;
      const y = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      const d = parseInt(parts[2], 10);
      const dt = new Date(Date.UTC(y, m - 1, d));
      return `${dt.getUTCDate()} ${MONTH_NAMES[dt.getUTCMonth()]} ${dt.getUTCFullYear()}`;
    }

    /* ==========================================================================
       4. NUMBER, CURRENCY & TEXT FORMATTERS (CHANGE 6: Accept N/A gracefully)
       ========================================================================== */
    function isNullLike(val) {
      if (val === null || val === undefined) return true;
      const s = String(val).trim().toLowerCase();
      return (
        s === '' ||
        s === '-' ||
        s === '–' ||
        s === '—' ||
        s === 'n/a' ||
        s === 'na' ||
        s === 'null' ||
        s === 'none' ||
        s === 'nil'
      );
    }

    function parseNum(val) {
      if (val === null || val === undefined) return null;
      if (typeof val === 'number') return (isNaN(val) || !isFinite(val)) ? null : val;
      const s = String(val).trim();
      if (isNullLike(s)) return null;
      const cleaned = s.replace(/[₹$,\s%]/g, '');
      if (cleaned === '' || isNullLike(cleaned)) return null;
      const n = parseFloat(cleaned);
      return (isNaN(n) || !isFinite(n)) ? null : n;
    }

    function formatIndianNumber(num) {
      if (num === null || num === undefined) return '–';
      const n = typeof num === 'number' ? num : parseNum(num);
      if (n === null || isNaN(n) || !isFinite(n)) return '–';

      const isNegative = n < 0;
      const absNum = Math.abs(n);
      const parts = absNum.toString().split('.');
      let intPart = parts[0];
      const decPart = parts.length > 1 ? '.' + parts[1] : '';

      if (intPart.length > 3) {
        const lastThree = intPart.substring(intPart.length - 3);
        const otherNumbers = intPart.substring(0, intPart.length - 3);
        const formattedOther = otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
        intPart = formattedOther + ',' + lastThree;
      }
      return (isNegative ? '-' : '') + intPart + decPart;
    }

    function formatCurrency(num, decimals = 0) {
      if (num === null || num === undefined) return '–';
      const n = typeof num === 'number' ? num : parseNum(num);
      if (n === null || isNaN(n) || !isFinite(n)) return '–';

      const isNegative = n < 0;
      const absNum = Math.abs(n);
      let fixedStr = decimals > 0 ? absNum.toFixed(decimals) : Math.round(absNum).toString();
      const parts = fixedStr.split('.');
      let intPart = parts[0];
      const decPart = parts.length > 1 ? '.' + parts[1] : '';

      if (intPart.length > 3) {
        const lastThree = intPart.substring(intPart.length - 3);
        const otherNumbers = intPart.substring(0, intPart.length - 3);
        const formattedOther = otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
        intPart = formattedOther + ',' + lastThree;
      }
      return (isNegative ? '-₹' : '₹') + intPart + decPart;
    }

    function formatPercent(numerator, denominator) {
      if (numerator === null || denominator === null || numerator === undefined || denominator === undefined) return '–';
      const num = typeof numerator === 'number' ? numerator : parseNum(numerator);
      const den = typeof denominator === 'number' ? denominator : parseNum(denominator);
      if (num === null || den === null || isNaN(num) || isNaN(den) || !isFinite(num) || !isFinite(den)) return '–';
      if (den === 0) return '–';
      const pct = (num / den) * 100;
      if (isNaN(pct) || !isFinite(pct)) return '–';
      return pct.toFixed(1) + '%';
    }

    function formatRawNum(val) {
      if (isNullLike(val)) return '–';
      const n = parseNum(val);
      if (n === null) return '–';
      return formatIndianNumber(n);
    }

    function formatRawCurrency(val, decimals = 0) {
      if (isNullLike(val)) return '–';
      const n = parseNum(val);
      if (n === null) return '–';
      return formatCurrency(n, decimals);
    }

    function formatText(val) {
      if (isNullLike(val)) return '–';
      return escapeHtml(String(val).trim());
    }

    function sumColumn(rows, key) {
      if (!rows || rows.length === 0) return null;
      let sum = 0;
      let hasValid = false;
      for (const r of rows) {
        const val = parseNum(r[key]);
        if (val !== null) {
          sum += val;
          hasValid = true;
        }
      }
      return hasValid ? sum : null;
    }

    /* ==========================================================================
       5. DATA RETRIEVAL & NORMALIZATION
       ========================================================================== */
    async function loadAllSheets() {
      state.errors = [];
      const bannerContainer = document.getElementById('banner-container');
      bannerContainer.innerHTML = '';

      const isUnconfigured = Object.values(CSV_SOURCES).some(url => !url || url.includes('PASTE_YOUR_'));

      if (isUnconfigured && !state.isDemoMode) {
        bannerContainer.innerHTML = `
          <div class="banner banner-error">
            <span class="banner-icon">⚠</span>
            <div class="banner-content">
              <strong>Google Sheet CSV URLs not configured:</strong> The CSV_SOURCES at the top of this file contains placeholder URLs.
              <div style="margin-top: 6px;">
                <button type="button" class="btn-primary" id="btn-load-demo" style="font-size: 12px; padding: 4px 10px;">
                  Load Sample Demo Data
                </button>
                <span style="font-size: 12px; margin-left: 8px; color: var(--text-muted);">
                  or paste published Google Sheet CSV URLs into the script config.
                </span>
              </div>
            </div>
          </div>
        `;

        document.getElementById('btn-load-demo')?.addEventListener('click', () => {
          activateDemoMode();
        });

        activateDemoMode(false);
        return;
      }

      const keys = Object.keys(CSV_SOURCES);
      const fetchPromises = keys.map(key => {
        const url = CSV_SOURCES[key];
        return fetch(url, { cache: 'no-store' })
          .then(async res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
            return { key, text: await res.text() };
          });
      });

      const results = await Promise.allSettled(fetchPromises);
      let failedTabs = [];

      results.forEach((res, index) => {
        const key = keys[index];
        if (res.status === 'fulfilled') {
          try {
            const parsedRows = parseCSV(res.value.text);
            state.data[key] = parsedRows.map(row => {
              const monday = parseDateToMonday(row.week_start);
              return { ...row, _monday: monday };
            });
          } catch (err) {
            console.error(`Error parsing CSV for ${key}:`, err);
            failedTabs.push(key);
            state.data[key] = [];
          }
        } else {
          console.warn(`Failed to load ${key} from ${CSV_SOURCES[key]}:`, res.reason);
          failedTabs.push(key);
          state.data[key] = [];
        }
      });

      if (failedTabs.length > 0) {
        state.errors = failedTabs;
        renderErrorBanners(failedTabs);
      }

      postLoadProcess();
    }

    function activateDemoMode(showNotice = true) {
      state.isDemoMode = true;
      const keys = Object.keys(DEMO_FALLBACK_DATA);
      keys.forEach(k => {
        state.data[k] = DEMO_FALLBACK_DATA[k].map(row => ({
          ...row,
          _monday: parseDateToMonday(row.week_start)
        }));
      });

      if (showNotice) {
        const bannerContainer = document.getElementById('banner-container');
        bannerContainer.innerHTML = `
          <div class="banner banner-info">
            <span class="banner-icon">ℹ</span>
            <div class="banner-content">
              <strong>Previewing with interactive sample data:</strong> Showing operational data across all 9 operational tabs.
            </div>
          </div>
        `;
      }

      postLoadProcess();
    }

    function renderErrorBanners(failedTabs) {
      const bannerContainer = document.getElementById('banner-container');
      const itemsHtml = failedTabs.map(tab => `<li>Failed to load <strong>${tab}</strong> data</li>`).join('');
      bannerContainer.innerHTML += `
        <div class="banner banner-error">
          <span class="banner-icon">⚠</span>
          <div class="banner-content">
            <strong>Data Fetch Incomplete:</strong> The following Google Sheet CSV tabs could not be loaded:
            <ul style="margin: 4px 0 6px 18px;">${itemsHtml}</ul>
            <button type="button" class="btn-primary" id="btn-load-demo-fallback" style="font-size: 11.5px; padding: 4px 8px; margin-top: 4px;">
              Load Sample Demo Data Instead
            </button>
          </div>
        </div>
      `;

      document.getElementById('btn-load-demo-fallback')?.addEventListener('click', () => {
        activateDemoMode();
      });
    }

    function postLoadProcess() {
      const mondaySet = new Set();
      Object.values(state.data).forEach(rows => {
        if (Array.isArray(rows)) {
          rows.forEach(r => {
            if (r._monday) mondaySet.add(r._monday);
          });
        }
      });

      state.weeks = Array.from(mondaySet).sort((a, b) => b.localeCompare(a));

      if (state.weeks.length > 0) {
        if (!state.selectedWeek || !state.weeks.includes(state.selectedWeek)) {
          state.selectedWeek = state.weeks[0];
        }
      } else {
        state.selectedWeek = null;
      }

      const now = new Date();
      state.lastLoadedAt = now.toTimeString().split(' ')[0];
      document.getElementById('last-loaded-display').textContent = `Data last loaded at ${state.lastLoadedAt}`;

      updateWeekSelectorUI();
      renderDashboard();
    }

    function updateWeekSelectorUI() {
      const labelEl = document.getElementById('current-week-label');
      const prevBtn = document.getElementById('btn-prev-week');
      const nextBtn = document.getElementById('btn-next-week');

      if (!state.selectedWeek || state.weeks.length === 0) {
        labelEl.textContent = 'No data available';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }

      labelEl.textContent = formatWeekLabel(state.selectedWeek);
      const currentIndex = state.weeks.indexOf(state.selectedWeek);

      prevBtn.disabled = currentIndex >= state.weeks.length - 1;
      nextBtn.disabled = currentIndex <= 0;
    }

    function navigateWeek(delta) {
      if (!state.selectedWeek || state.weeks.length === 0) return;
      const currentIndex = state.weeks.indexOf(state.selectedWeek);
      const targetIndex = currentIndex + delta;
      if (targetIndex >= 0 && targetIndex < state.weeks.length) {
        state.selectedWeek = state.weeks[targetIndex];
        updateWeekSelectorUI();
        renderDashboard();
      }
    }

    /* ==========================================================================
       7. CARRY-FORWARD & STRICT FILTERS
       ========================================================================== */
    function getSectionRowsWithCarryForward(tabKey, targetWeek) {
      const rows = state.data[tabKey] || [];
      const currentWeekRows = rows.filter(r => r._monday === targetWeek);

      if (currentWeekRows.length > 0) {
        return { rows: currentWeekRows, isCarriedForward: false, asOfWeek: targetWeek };
      }

      const earlierWeeks = state.weeks
        .filter(w => w < targetWeek)
        .sort((a, b) => b.localeCompare(a));

      for (const w of earlierWeeks) {
        const earlierRows = rows.filter(r => r._monday === w);
        if (earlierRows.length > 0) {
          return { rows: earlierRows, isCarriedForward: true, asOfWeek: w };
        }
      }

      return { rows: [], isCarriedForward: false, asOfWeek: null };
    }

    function getStrictWeekRows(tabKey, targetWeek) {
      const rows = state.data[tabKey] || [];
      return rows.filter(r => r._monday === targetWeek);
    }

    /* ==========================================================================
       8. METRIC CALCULATION HELPERS
       ========================================================================== */
    // Community: sum highest members_total per region
    function getCommunityTotalMembers(commRows) {
      if (!commRows || commRows.length === 0) return null;
      const regionMaxMap = new Map();
      commRows.forEach(r => {
        const reg = (r.region || '').trim().toLowerCase();
        if (!reg) return;
        const val = parseNum(r.members_total);
        if (val !== null) {
          if (!regionMaxMap.has(reg) || val > regionMaxMap.get(reg)) {
            regionMaxMap.set(reg, val);
          }
        }
      });
      if (regionMaxMap.size === 0) return null;
      let total = 0;
      for (const val of regionMaxMap.values()) {
        total += val;
      }
      return total;
    }

    // ITI: count distinct states with email_sent > 0
    function getEmailCampaignsRun(itiRows) {
      if (!itiRows || itiRows.length === 0) return null;
      const statesWithEmail = new Set();
      itiRows.forEach(r => {
        const state = (r.state || '').trim().toLowerCase();
        const emailSent = parseNum(r.email_sent);
        if (state && emailSent !== null && emailSent > 0) {
          statesWithEmail.add(state);
        }
      });
      return statesWithEmail.size;
    }

    // Computes top 6 metrics for given week
    function calculateWeekSummaryMetrics(targetWeek) {
      if (!targetWeek) return null;

      const waRows = getStrictWeekRows('WA_CAMPAIGNS', targetWeek);
      const commRows = getStrictWeekRows('COMMUNITY', targetWeek);
      const itiRows = getStrictWeekRows('ITI', targetWeek);
      const leadRows = getStrictWeekRows('LEADS', targetWeek);
      const metaRows = getStrictWeekRows('META_ADS', targetWeek);

      // 1. WhatsApp Campaigns Run
      const waCampaignNames = new Set(waRows.map(r => (r.campaign || '').trim()).filter(Boolean));
      const waCampaignsCount = waRows.length > 0 ? waCampaignNames.size : (state.data.WA_CAMPAIGNS?.length > 0 ? 0 : null);

      // 2. WhatsApp Community Count
      const commTotalMembers = getCommunityTotalMembers(commRows);

      // 3. ITI Colleges Approached (sum of colleges_in_state)
      const itiCollegesApproached = sumColumn(itiRows, 'colleges_in_state');

      // 4. Incoming Leads (BD) (active leads count: stage != "Dropped")
      const activeLeads = leadRows.filter(r => (r.stage || '').toLowerCase().trim() !== 'dropped');
      const activeLeadsCount = leadRows.length > 0 ? activeLeads.length : (state.data.LEADS?.length > 0 ? 0 : null);

      // 5. Email Campaigns Run (distinct states in ITI with email_sent > 0)
      const emailCampaignsRun = getEmailCampaignsRun(itiRows);

      // 6. Meta Ad Spend (sum of spend in META_ADS)
      const linkedInSpend = sumColumn(metaRows, 'spend');

      return {
        waCampaignsCount,
        commTotalMembers,
        itiCollegesApproached,
        activeLeadsCount,
        emailCampaignsRun,
        linkedInSpend
      };
    }

    // Builds diff badge vs last week
    function renderTrendBadge(currentVal, prevVal, isSpend = false, isCurrency = false) {
      if (currentVal === null || prevVal === null) {
        return `<span class="trend-badge trend-neutral">No earlier week to compare</span>`;
      }

      const diff = currentVal - prevVal;
      if (diff === 0) {
        return `<span class="trend-badge trend-neutral">0 vs last week</span>`;
      }

      const isPositive = diff > 0;
      let badgeClass = 'trend-neutral';
      if (isSpend) {
        badgeClass = isPositive ? 'trend-amber' : 'trend-negative';
      } else {
        badgeClass = isPositive ? 'trend-positive' : 'trend-negative';
      }

      const formattedVal = isCurrency
        ? (isPositive ? '+₹' + formatIndianNumber(Math.abs(diff)) : '-₹' + formatIndianNumber(Math.abs(diff)))
        : (isPositive ? '+' + formatIndianNumber(diff) : formatIndianNumber(diff));

      return `<span class="trend-badge ${badgeClass}">${formattedVal} vs last week</span>`;
    }

    /* ==========================================================================
       9. SECTION BUILDERS
       ========================================================================== */

    // Highlights Card
    function renderHighlightsSection(week) {
      const rows = state.data.WEEKS || [];

      const current = calculateWeekSummaryMetrics(currentWeek);
      const currentIndex = state.weeks.indexOf(currentWeek);

            </div>
            <div class="summary-tile-trend">${itiCollegesBadge}</div>
          </div>

          <div class="summary-tile">
            <div>
              <div class="summary-tile-label">Incoming Leads (BD)</div>
              <div class="summary-tile-value">${formatIndianNumber(current.activeLeadsCount)}</div>
            </div>
            <div class="summary-tile-trend">${leadsBadge}</div>
          </div>

          <div class="summary-tile">
            <div>

    }

    // Section A: ITI College Outreach (CHANGE 1: Raw numbers only, Responded columns, Sheet Link button, 4 restructured tiles)
    function renderITISection(week) {
      const { rows, isCarriedForward, asOfWeek } = getSectionRowsWithCarryForward('ITI', week);

      // Check for iti_sheet_link in WEEKS table
      const weekRow = (state.data.WEEKS || []).find(r => r._monday === week);
      const itiSheetLink = (weekRow && weekRow.iti_sheet_link && !isNullLike(weekRow.iti_sheet_link))
        ? String(weekRow.iti_sheet_link).trim()
        : null;

      const itiLinkBtnHtml = itiSheetLink
        ? `<a href="${escapeHtml(itiSheetLink)}" target="_blank" rel="noopener noreferrer" class="btn-outline-teal" title="Open detailed ITI sheet in new tab">↗ View detailed college data</a>`
        : '';

      if (rows.length === 0) {
        return `
          <section class="ops-section">
            <div class="section-header">
              <h2 class="section-title">ITI College Outreach</h2>
              ${itiLinkBtnHtml}
            </div>
            <div class="empty-state-box">Nothing entered for this week.</div>
          </section>
        `;
      }

      // Compute aggregate metrics
      let totalColleges = 0;
      let govtColleges = 0;
      let privateColleges = 0;
      let emailSentGovt = 0;
      let emailSentPriv = 0;
      let waSentGovt = 0;
      let waSentPriv = 0;
      const distinctStates = new Set();

      rows.forEach(r => {
        const stateName = (r.state || '').trim();
        if (stateName && !isNullLike(stateName)) {
          distinctStates.add(stateName.toLowerCase());
        }

        const isGovt = !(r.college_type && String(r.college_type).toLowerCase().includes('priv'));
        const colleges = parseNum(r.colleges_in_state) || 0;
        const eSent = parseNum(r.email_sent) || 0;
        const wSent = parseNum(r.wa_sent) || 0;

        totalColleges += colleges;
        if (isGovt) {
          govtColleges += colleges;
          emailSentGovt += eSent;
          waSentGovt += wSent;
        } else {
          privateColleges += colleges;
          emailSentPriv += eSent;
          waSentPriv += wSent;
        }
      });

      const totalEmailSent = sumColumn(rows, 'email_sent');
      const totalEmailDelivered = sumColumn(rows, 'email_delivered');
      const totalEmailRead = sumColumn(rows, 'email_read');
      const totalEmailResponded = sumColumn(rows, 'email_responded');

      const totalWaSent = sumColumn(rows, 'wa_sent');
      const totalWaDelivered = sumColumn(rows, 'wa_delivered');
      const totalWaRead = sumColumn(rows, 'wa_read');
      const totalWaResponded = sumColumn(rows, 'wa_responded');

      const statesCovered = distinctStates.size;

      // Group rows by state
      const statesMap = new Map();
      rows.forEach(r => {
        const stateName = (r.state || '–').trim();
        if (!statesMap.has(stateName)) {
          statesMap.set(stateName, []);
        }
        statesMap.get(stateName).push(r);
      });

      let tableRowsHtml = '';
      let isFirstState = true;

      statesMap.forEach((stateRows, stateName) => {
        // Sort Government row first, then Private
        stateRows.sort((a, b) => {
          const typeA = (a.college_type || 'Government').trim().toLowerCase();
          const typeB = (b.college_type || 'Government').trim().toLowerCase();
          const isGovtA = typeA.includes('govt') || typeA.includes('government');
          const isGovtB = typeB.includes('govt') || typeB.includes('government');
          if (isGovtA && !isGovtB) return -1;
          if (!isGovtA && isGovtB) return 1;
          return typeA.localeCompare(typeB);
        });

        const dividerClass = isFirstState ? '' : 'state-group-divider';
        isFirstState = false;

        stateRows.forEach((r, idx) => {
          const rawType = (r.college_type || '').trim();
          const normalizedType = rawType && rawType.toLowerCase().includes('priv') ? 'Private' : 'Government';
          const isGovtRow = normalizedType === 'Government';

          const emailSent = parseNum(r.email_sent);
          const emailDelivered = parseNum(r.email_delivered);
          const emailRead = parseNum(r.email_read);
          const emailResponded = parseNum(r.email_responded);

          const waSent = parseNum(r.wa_sent);
          const waDelivered = parseNum(r.wa_delivered);
          const waRead = parseNum(r.wa_read);
          const waResponded = parseNum(r.wa_responded);

          // Soft warnings per row
          const warnings = [];
          if (emailDelivered !== null && emailSent !== null && emailDelivered > emailSent) {
            warnings.push(`Email delivered (${emailDelivered}) > sent (${emailSent})`);
          }
          if (emailRead !== null && emailDelivered !== null && emailRead > emailDelivered) {
            warnings.push(`Email read (${emailRead}) > delivered (${emailDelivered})`);
          }
          if (emailResponded !== null && emailRead !== null && emailResponded > emailRead) {
            warnings.push(`Email responded (${emailResponded}) > read (${emailRead})`);
          }
          if (waDelivered !== null && waSent !== null && waDelivered > waSent) {
            warnings.push(`WA delivered (${waDelivered}) > sent (${waSent})`);
          }
          if (waRead !== null && waDelivered !== null && waRead > waDelivered) {
            warnings.push(`WA read (${waRead}) > delivered (${waDelivered})`);
          }
          if (waResponded !== null && waRead !== null && waResponded > waRead) {
            warnings.push(`WA responded (${waResponded}) > read (${waRead})`);
          }

          const warningIcon = warnings.length > 0
            ? `<span class="soft-warning-icon" title="${escapeHtml(warnings.join('; '))}">&nbsp;⚠</span>`
            : '';

          const rowDivider = (idx === 0) ? dividerClass : '';
          const stateDisplay = isGovtRow
            ? `<strong>${escapeHtml(stateName)}</strong>`
            : `<span style="color: var(--text-subtle); padding-left: 12px;">↳</span>`;

          tableRowsHtml += `
            <tr class="${rowDivider}">
              <td class="text-left font-medium">${stateDisplay}</td>
              <td class="text-left"><span class="college-type-tag ${normalizedType.toLowerCase()}">${normalizedType}</span></td>
              <td class="text-right">${formatRawNum(r.colleges_in_state)}</td>
              <td class="text-right">${formatRawNum(r.email_sent)}</td>
              <td class="text-right">${formatRawNum(r.email_delivered)}</td>
              <td class="text-right">${formatRawNum(r.email_read)}</td>
              <td class="text-right">${formatRawNum(r.email_responded)}</td>
              <td class="text-right">${formatRawNum(r.wa_sent)}</td>
              <td class="text-right">${formatRawNum(r.wa_delivered)}</td>
              <td class="text-right">${formatRawNum(r.wa_read)}</td>
              <td class="text-right">${formatRawNum(r.wa_responded)}</td>
              <td class="text-center">${warningIcon || '–'}</td>
            </tr>
          `;
        });
      });

      const carryForwardHtml = isCarriedForward
        ? `<div class="carry-forward-notice">ℹ As of week of ${formatCarryForwardDate(asOfWeek)} (no data for selected week)</div>`
        : '';

      return `

          <div class="section-header">
            <h2 class="section-title">ITI College Outreach</h2>
            ${itiLinkBtnHtml}
          </div>

          ${carryForwardHtml}

          <!-- Restructured 4 Summary Tiles (CHANGE 1d) -->
          <div class="section-stats-bar">
            <div class="mini-stat-card">
              <span class="mini-stat-label">Colleges Mapped</span>
              <span class="mini-stat-val">${formatIndianNumber(totalColleges)}</span>
              <span class="mini-stat-sub">Govt: ${formatIndianNumber(govtColleges)} | Private: ${formatIndianNumber(privateColleges)}</span>
            </div>
            <div class="mini-stat-card">
              <span class="mini-stat-label">Email Sent</span>
              <span class="mini-stat-val">${formatIndianNumber(totalEmailSent)}</span>
              <span class="mini-stat-sub">Govt: ${formatIndianNumber(emailSentGovt)} | Private: ${formatIndianNumber(emailSentPriv)}</span>
              <span class="mini-stat-sub">${formatIndianNumber(totalEmailDelivered)} delivered · ${formatIndianNumber(totalEmailRead)} read · ${formatIndianNumber(totalEmailResponded)} responded</span>
            </div>
            <div class="mini-stat-card">
              <span class="mini-stat-label">WA Sent</span>
              <span class="mini-stat-val">${formatIndianNumber(totalWaSent)}</span>
              <span class="mini-stat-sub">Govt: ${formatIndianNumber(waSentGovt)} | Private: ${formatIndianNumber(waSentPriv)}</span>
              <span class="mini-stat-sub">${formatIndianNumber(totalWaDelivered)} delivered · ${formatIndianNumber(totalWaRead)} read · ${formatIndianNumber(totalWaResponded)} responded</span>
            </div>
            <div class="mini-stat-card">
              <span class="mini-stat-label">States Covered</span>
              <span class="mini-stat-val">${statesCovered}</span>
              <span class="mini-stat-sub">${statesCovered === 1 ? '1 active state' : `${statesCovered} active states`}</span>
            </div>
          </div>

          <!-- Raw Numbers Only Table (CHANGE 1b) -->
          <div class="table-container">
            <table class="ops-table">
              <thead>
                <tr>
                  <th class="text-left">State</th>
                  <th class="text-left">Type</th>
                  <th class="text-right">Colleges</th>
                  <th class="text-right">Email Sent</th>

              <tbody>

        </section>
      `;
    }

              <span class="mini-stat-val" style="font-size: 15px;">${bestRoiDisplay}</span>
            </div>
            <div class="mini-stat-card">
              <span class="mini-stat-label">Avg ROI</span>
              <span class="mini-stat-val">${avgRoiDisplay}</span>
            </div>
          </div>

          <!-- Table -->
          <div class="table-container">
            <table class="ops-table">
              <thead>
                <tr>
                  <th class="text-left">Activity</th>
                  <th class="text-left">Category</th>
                  <th class="text-right">Cost (₹)</th>
                  <th class="text-left">Outcome</th>
                  <th class="text-right">Value</th>
                  <th class="text-left">Unit</th>
                  <th class="text-right">ROI %</th>
                  <th class="text-left">Notes</th>
                </tr>
              </thead>
              <tbody>
                ${tableRowsHtml}
                <tr class="totals-row">
                  <td class="text-left">Total</td>
                  <td class="text-left">–</td>
                  <td class="text-right">${formatCurrency(totalCost)}</td>
                  <td class="text-left">–</td>
                  <td class="text-right">–</td>
                  <td class="text-left">–</td>
                  <td class="text-right">–</td>
                  <td class="text-left">–</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    /* ==========================================================================
       10. COPY SUMMARY GENERATOR (Implementation Notes: omit % from ITI & WA, add payroll)
       ========================================================================== */
    function generateCopySummaryText(targetWeek) {
      if (!targetWeek) return '';

      const weekLabel = formatWeekLabel(targetWeek);
      const lines = [`Weekly Ops – ${weekLabel}`, ''];

      // ITI Outreach (Raw numbers, omit %)
      const itiRows = getStrictWeekRows('ITI', targetWeek);
      if (itiRows.length > 0) {
        let totalCols = 0, govtCols = 0, privCols = 0;
        itiRows.forEach(r => {
          const isGovt = !(r.college_type && String(r.college_type).toLowerCase().includes('priv'));
          const c = parseNum(r.colleges_in_state) || 0;
          totalCols += c;
          if (isGovt) govtCols += c;
          else privCols += c;
        });

        const emailSent = sumColumn(itiRows, 'email_sent');
        const emailDelivered = sumColumn(itiRows, 'email_delivered');
        const emailRead = sumColumn(itiRows, 'email_read');
        const emailResponded = sumColumn(itiRows, 'email_responded');

        const waSent = sumColumn(itiRows, 'wa_sent');
        const waDelivered = sumColumn(itiRows, 'wa_delivered');
        const waRead = sumColumn(itiRows, 'wa_read');
        const waResponded = sumColumn(itiRows, 'wa_responded');

        lines.push(`• ITI: ${formatIndianNumber(totalCols)} colleges approached (Govt: ${formatIndianNumber(govtCols)}, Private: ${formatIndianNumber(privCols)}), ${formatIndianNumber(emailSent)} emails sent (${formatIndianNumber(emailDelivered)} delivered, ${formatIndianNumber(emailRead)} read, ${formatIndianNumber(emailResponded)} responded), ${formatIndianNumber(waSent)} WhatsApp messages (${formatIndianNumber(waDelivered)} delivered, ${formatIndianNumber(waRead)} read, ${formatIndianNumber(waResponded)} responded)`);
      }

      // WA Campaigns (Omit %, include 1st Month Payroll)
      const waRows = getStrictWeekRows('WA_CAMPAIGNS', targetWeek);
      if (waRows.length > 0) {
        const count = waRows.length;
        const contacts = sumColumn(waRows, 'contacts');
        const joined = sumColumn(waRows, 'joined');
        const payroll = sumColumn(waRows, 'first_month_payroll');

        lines.push(`• WA Campaigns: ${count} campaigns, ${formatIndianNumber(contacts)} contacts, ${formatIndianNumber(joined)} joined, ${formatCurrency(payroll)} 1st month payroll`);
      }

      // Community
      const commRowsRaw = getStrictWeekRows('COMMUNITY', targetWeek);
      const VALID_REGIONS = ['east', 'west', 'north', 'south', 'central'];
      const commRows = commRowsRaw.filter(r => VALID_REGIONS.includes((r.region || '').toLowerCase().trim()));

      if (commRows.length > 0) {
        const membersAdded = sumColumn(commRows, 'members_added');
        const membersTotal = getCommunityTotalMembers(commRows);
        const jobsPosted = sumColumn(commRows, 'jobs_posted');

        let fastestRegion = '–';
        let maxAdded = -1;
        commRows.forEach(r => {
          const added = parseNum(r.members_added);
          if (added !== null && added > maxAdded) {
            maxAdded = added;
            fastestRegion = r.region;
          }
        });

        lines.push(`• Community: ${formatIndianNumber(membersAdded)} members added (total ${formatIndianNumber(membersTotal)}), ${formatIndianNumber(jobsPosted)} jobs posted. Fastest growing: ${fastestRegion}`);
      }

      // Meta / LinkedIn Ads (Include conversion rate)
      const metaRows = getStrictWeekRows('META_ADS', targetWeek);
      if (metaRows.length > 0) {
        const spend = sumColumn(metaRows, 'spend');
        const impressions = sumColumn(metaRows, 'impressions');
        const calls = sumColumn(metaRows, 'calls');
        const joined = sumColumn(metaRows, 'joined');
        const convRate = formatPercent(joined, calls);

        lines.push(`• LinkedIn / Meta Ads: ₹${formatIndianNumber(spend)} spent, ${formatIndianNumber(impressions)} impressions, ${formatIndianNumber(calls)} calls, ${formatIndianNumber(joined)} joined (${convRate} conversion)`);
      }

      // Social
      const socialRows = getStrictWeekRows('SOCIAL', targetWeek);
      if (socialRows.length > 0) {
        const posts = sumColumn(socialRows, 'posts');
        const impressions = sumColumn(socialRows, 'impressions');
        const followersGained = sumColumn(socialRows, 'followers_gained');

        lines.push(`• Social: ${formatIndianNumber(posts)} posts, ${formatIndianNumber(impressions)} impressions, ${formatIndianNumber(followersGained)} followers gained`);
      }

      // Other Activities
      const otherRows = getStrictWeekRows('OTHER_ACTIVITIES', targetWeek);
      if (otherRows.length > 0) {
        const actCount = otherRows.length;
        const totalReach = sumColumn(otherRows, 'reach');
        const totalCost = sumColumn(otherRows, 'cost');

        lines.push(`• Other Activities: ${actCount} activities run, ${formatIndianNumber(totalReach)} reach, ${formatCurrency(totalCost)} total cost`);
      }

      // Leads
      const leadRows = getStrictWeekRows('LEADS', targetWeek);
      if (leadRows.length > 0) {
        const activeRows = leadRows.filter(r => (r.stage || '').toLowerCase().trim() !== 'dropped');
        const activeCount = activeRows.length;
        const pipelineRev = sumColumn(activeRows, 'expected_revenue') || 0;
        const pipelineGP = sumColumn(activeRows, 'expected_gp') || 0;

        const signedRows = leadRows.filter(r => (r.stage || '').toLowerCase().trim() === 'contract signed');
        const signedRev = sumColumn(signedRows, 'expected_revenue') || 0;
        const signedGP = sumColumn(signedRows, 'expected_gp') || 0;
        const marginPct = signedRev > 0 ? ((signedGP / signedRev) * 100).toFixed(1) : '–';

        lines.push(`• Leads: ${activeCount} active leads, pipeline ₹${formatIndianNumber(pipelineRev)} / GP ₹${formatIndianNumber(pipelineGP)}. Signed ₹${formatIndianNumber(signedRev)} / GP ₹${formatIndianNumber(signedGP)} (${marginPct}% margin)`);
      }

      // ROI Summary
      const roiRows = getStrictWeekRows('ROI', targetWeek);
      if (roiRows.length > 0) {
        const totalCost = sumColumn(roiRows, 'cost');
        const count = roiRows.length;
        let bestRoiVal = -Infinity;
        let bestRoiActivity = '';
        let sumRoi = 0;
        let countRoi = 0;

        roiRows.forEach(r => {
          const val = parseNum(r.roi_percent);
          if (val !== null) {
            sumRoi += val;
            countRoi++;
            if (val > bestRoiVal) {
              bestRoiVal = val;
              bestRoiActivity = r.activity || 'Activity';
            }
          }
        });

        const avgRoiStr = countRoi > 0 ? (sumRoi / countRoi).toFixed(1) + '%' : '–';
        const bestRoiStr = countRoi > 0 ? `${bestRoiActivity} (${bestRoiVal}%)` : '–';

        lines.push(`• ROI Summary: ${formatCurrency(totalCost)} spend across ${count} activities. Best ROI: ${bestRoiStr}, Avg ROI: ${avgRoiStr}`);
      }

      return lines.join('\n');
    }

    async function handleCopySummary() {
      if (!state.selectedWeek) return;
      const text = generateCopySummaryText(state.selectedWeek);

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.left = '-9999px';
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        }
        showToast('Summary copied to clipboard!');
      } catch (err) {
        console.error('Failed to copy to clipboard:', err);
        showToast('Failed to copy. Check permissions.');
      }
    }

    function showToast(msg) {
      const toastEl = document.getElementById('toast');
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2600);
    }

    /* ==========================================================================
       11. MAIN DASHBOARD RENDERER
       Rebuilds main content area on week change or data reload.
       ========================================================================== */
    function renderDashboard() {
      const container = document.getElementById('dashboard-content');
      if (!container) return;

      if (!state.selectedWeek || state.weeks.length === 0) {
        container.innerHTML = `
          <div class="empty-state-box" style="padding: 60px 20px;">
            <h3>No Operations Data Found</h3>
            <p style="margin-top: 8px;">Please check the CSV_SOURCES URLs or click Refresh.</p>
          </div>
        `;
        return;
      }

      const week = state.selectedWeek;
      const htmlParts = [
        renderHighlightsSection(week),
        renderTopSummaryTiles(week),
        renderITISection(week),
        renderWACampaignsSection(week),
        renderCommunitySection(week),
        renderMetaAdsSection(week),
        renderSocialSection(week),
        renderOtherActivitiesSection(week),
        renderLeadsSection(week),
        renderROISection(week)
      ];

      container.innerHTML = htmlParts.join('\n');
    }

    /* ==========================================================================
       12. THEME & INITIALIZATION EVENT LISTENERS
       ========================================================================== */
    function initTheme() {
      const savedTheme = localStorage.getItem('agy_ops_theme') || 'auto';
      applyTheme(savedTheme);

      document.getElementById('btn-theme-toggle')?.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'auto';
        let nextTheme = 'dark';
        if (currentTheme === 'dark') nextTheme = 'light';
        else if (currentTheme === 'light') nextTheme = 'auto';
        else nextTheme = 'dark';

        applyTheme(nextTheme);
        localStorage.setItem('agy_ops_theme', nextTheme);
      });
    }

    function applyTheme(theme) {
      const labelEl = document.getElementById('theme-btn-label');
      if (theme === 'auto') {
        document.documentElement.removeAttribute('data-theme');
        if (labelEl) labelEl.textContent = 'Auto';
      } else {
        document.documentElement.setAttribute('data-theme', theme);
        if (labelEl) labelEl.textContent = theme.charAt(0).toUpperCase() + theme.slice(1);
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();

      document.getElementById('btn-prev-week')?.addEventListener('click', () => navigateWeek(1));
      document.getElementById('btn-next-week')?.addEventListener('click', () => navigateWeek(-1));
      document.getElementById('btn-refresh')?.addEventListener('click', () => loadAllSheets());
      document.getElementById('btn-copy-summary')?.addEventListener('click', handleCopySummary);

      loadAllSheets();
    });
  </script>
